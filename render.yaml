services:
  - type: web
    name: taskflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/app.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://taskflow-frontend-pi-mocha.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
